# Push to main → build on GitHub → upload to FastComet Node app.
# One-time secrets: FASTCOMET_HOST, FASTCOMET_USER, FASTCOMET_SSH_KEY, FASTCOMET_PATH
# See SETUP-OPTION-2.md

name: Deploy to FastComet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FastComet secrets
        env:
          FASTCOMET_HOST: ${{ secrets.FASTCOMET_HOST }}
          FASTCOMET_USER: ${{ secrets.FASTCOMET_USER }}
          FASTCOMET_SSH_KEY: ${{ secrets.FASTCOMET_SSH_KEY }}
          FASTCOMET_PATH: ${{ secrets.FASTCOMET_PATH }}
        run: |
          missing=0
          [ -z "$FASTCOMET_HOST" ] && echo "::error::Missing secret FASTCOMET_HOST — see SETUP-OPTION-2.md" && missing=1
          [ -z "$FASTCOMET_USER" ] && echo "::error::Missing secret FASTCOMET_USER" && missing=1
          [ -z "$FASTCOMET_SSH_KEY" ] && echo "::error::Missing secret FASTCOMET_SSH_KEY" && missing=1
          [ -z "$FASTCOMET_PATH" ] && echo "::error::Missing secret FASTCOMET_PATH" && missing=1
          if [ "$missing" -eq 1 ]; then
            echo "::notice::Add all four secrets at https://github.com/grantday/universe-security/settings/secrets/actions"
            exit 1
          fi
          echo "FastComet secrets present — deploying to $FASTCOMET_PATH"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build standalone bundle
        run: npm run build:fastcomet
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://universe-security.org
          NEXT_PUBLIC_SERVER_URL: https://universe-security.org
          PAYLOAD_SECRET: build-placeholder-not-used-at-runtime
          DATABASE_URI: file:./build.db

      - name: Pack deploy archive
        run: tar -czf deploy.tar.gz -C godaddy-deploy .

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FASTCOMET_HOST }}
          username: ${{ secrets.FASTCOMET_USER }}
          key: ${{ secrets.FASTCOMET_SSH_KEY }}
          port: 22
          source: deploy.tar.gz
          target: /tmp

      - name: Extract on server and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FASTCOMET_HOST }}
          username: ${{ secrets.FASTCOMET_USER }}
          key: ${{ secrets.FASTCOMET_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP="${{ secrets.FASTCOMET_PATH }}"
            mkdir -p "$APP"
            tar -xzf /tmp/deploy.tar.gz -C "$APP"
            rm -f /tmp/deploy.tar.gz
            mkdir -p "$APP/tmp"
            touch "$APP/tmp/restart.txt"
            echo "Deployed to $APP at $(date -u)"
